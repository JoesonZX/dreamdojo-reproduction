# Exp4-B — same as Exp4-A but a STRONGER action-subspace bottleneck (beta=1e-2).
# Sweeps the bottleneck strength: too strong may also squeeze out action info.
model:
  image_channels: 3
  lam_model_dim: 512
  lam_latent_dim: 40
  lam_patch_size: 16
  lam_enc_blocks: 8
  lam_dec_blocks: 8
  lam_num_heads: 8
  lam_dropout: 0.0
  beta: 1.0e-2          # = beta_action: stronger bottleneck on z_a[:32]
  beta_env: 1.0e-6      # KL weight on z_e[32:]
  env_dim: 8
  action_dim: 18
  action_head: true
  lambda_action: 1.0
  lambda_indep: 0.0
  log_path: /home/xuan/embodied-ai/checkpoints/lam-dis/exp4_kl_b/log_imgs

data:
  dataset_type: egodex
  data_root: /home/xuan/embodied-ai/data/egodex/test_240p
  img_h: 240
  img_w: 320
  downsample_factors: [1, 2]
  val_ratio: 0.1
  seed: 42
  load_actions: true

training:
  per_gpu_batch_size: 32
  gradient_accumulation_steps: 1
  num_workers: 10
  pin_memory: true
  total_steps: 10000
  lr: 2.5e-5
  weight_decay: 0.01
  warmup_steps: 1000
  mixed_precision: bf16
  output_dir: /home/xuan/embodied-ai/checkpoints/lam-dis/exp4_kl_b
  save_every: 2000
  eval_every: 1000
  log_every: 100
  keep_last_n: 3

logging:
  project: dreamdojo-lam-disentangle
  run_name: dis-exp4-klB-ba1e2
  use_wandb: false
