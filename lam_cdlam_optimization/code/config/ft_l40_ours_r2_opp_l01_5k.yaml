# Ours-R2 (l01): Ours-A trunk + dataset-native opposite-verb margin, lambda_opposite=0.1.
# Opposite = same-task/different-resolved-verb (no hardcoded map); lambda swept.
# Replaces the synthetic time-reversal loss (Ours-B/B2) with a margin sourced from
# actual same-task/opposite-verb clips, directly optimizing the eval diagnostic
# `rev_hard_margin`. Requires a task-grouped PK sampler so each micro-batch contains
# same-task/opposite-verb pairs.
model:
  image_channels: 3
  lam_model_dim: 1024
  lam_latent_dim: 40
  lam_patch_size: 16
  lam_enc_blocks: 24
  lam_dec_blocks: 24
  lam_num_heads: 16
  lam_dropout: 0.0
  beta: 3.0e-3
  beta_env: 1.0e-6
  env_dim: 8
  action_dim: 18
  action_head: true
  lambda_action: 1.0
  lambda_indep: 0.0
  lambda_zero: 0.1
  zero_margin: 0.05
  # Synthetic reverse / action-vector hardneg OFF; real opposite-verb margin ON.
  lambda_reverse: 0.0
  lambda_hardneg: 0.0
  lambda_opposite: 0.1
  opposite_margin: 0.2
  opposite_warmup: 500
  init_from: /home/xuan/embodied-ai/checkpoints/pretrained/LAM_400k.ckpt
  freeze_encoder: false
  log_path: /home/xuan/embodied-ai/checkpoints/lam-dis/ft_l40_ours_r2_opp_l01_5k/log_imgs

data:
  dataset_type: egodex
  data_root: /home/xuan/embodied-ai/data/egodex/test_240p
  img_h: 240
  img_w: 320
  downsample_factors: [1, 2]
  val_ratio: 0.1
  seed: 42
  load_actions: true
  load_verbs: true
  # Task-grouped PK batches: same-task/opposite-verb negatives require task grouping.
  pk_sampler: true
  pk_label: task
  classes_per_batch: 2
  samples_per_class: 4
  # Empirically ~54% of P2K4 micro-batches contain an opposite pair (61/107 tasks are
  # non-reversible); with accum=4 that is ~95% of optimizer steps. Keep all tasks (false)
  # so recon/action/KL see the full distribution like Ours-A. Set true for a robustness
  # ablation that trains ONLY on the 46 reversible tasks (higher anchor rate, but shifts
  # the data distribution and can confound action_r2 vs Ours-A).
  pk_reversible_only: false

training:
  per_gpu_batch_size: 4          # ignored when pk_sampler=true (batch = P*K = 8)
  gradient_accumulation_steps: 4
  num_workers: 10
  pin_memory: true
  total_steps: 5000
  lr: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 200
  mixed_precision: bf16
  output_dir: /home/xuan/embodied-ai/checkpoints/lam-dis/ft_l40_ours_r2_opp_l01_5k
  save_every: 1000
  eval_every: 500
  log_every: 50
  keep_last_n: 1

logging:
  project: dreamdojo-lam-disentangle
  run_name: ft-l40-ours-r2-opp-l01-5k
  use_wandb: false
