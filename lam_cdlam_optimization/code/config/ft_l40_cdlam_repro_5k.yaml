# CD-LAM recipe reproduced AT OUR SCALE ON OUR TRUNK (controlled comparison).
# = KL trunk + L_zero (their L_cal analogue) + L_emb (SAM3 fg-weighted recon)
#   + SigLIP pairwise contrast on 12-way coarse primitives (their L_ctr, Eq.10),
#   labels from code/primitive_labels.py — opposite pairs MERGED by construction,
#   exactly as in CD-LAM Appendix B. Action head kept like every model in our
#   family (deviation from CD-LAM, which is action-free; note in the paper).
#
# ⚠ REQUIRES lambda_primitive_ctr implementation in train.py (stage0 plan T2).
#   BEFORE trusting this run, verify the training log prints a `pctr` loss term
#   with nonzero pair counts — an older train.py would silently ignore the flag
#   and train an Ours-A+L_emb instead.
model:
  image_channels: 3
  lam_model_dim: 1024
  lam_latent_dim: 40
  lam_patch_size: 16
  lam_enc_blocks: 24
  lam_dec_blocks: 24
  lam_num_heads: 16
  lam_dropout: 0.0
  beta: 3.0e-3
  beta_env: 1.0e-6
  env_dim: 8
  action_dim: 18
  action_head: true
  lambda_action: 1.0
  lambda_indep: 0.0
  lambda_zero: 0.1
  zero_margin: 0.05
  # Our losses OFF — this is the external reference recipe.
  lambda_reverse: 0.0
  lambda_hardneg: 0.0
  lambda_opposite: 0.0
  # CD-LAM L_ctr: SigLIP pairwise sigmoid on coarse primitives.
  contrastive: true            # enables the projection head r_omega
  proj_dim: 64
  lambda_primitive_ctr: 0.1
  primitive_ctr_warmup: 500
  primitive_ctr_tau_init: 10.0   # learnable logit scale init (SigLIP convention)
  primitive_ctr_bias_init: -10.0 # learnable bias init (SigLIP convention)
  init_from: /home/xuan/embodied-ai/checkpoints/pretrained/LAM_400k.ckpt
  freeze_encoder: false
  log_path: /home/xuan/embodied-ai/checkpoints/lam-dis/ft_l40_cdlam_repro_5k/log_imgs

foreground:
  use_fg_loss: true
  fg_mask_type: sam3_hoc
  # [hand, object, contact] channel weights; background stays 1x; samples without
  # a precomputed mask fall back to uniform weighting (run stage0 T1 first to
  # push mask coverage up, else L_emb is diluted — record coverage in the report).
  fg_channel_weights: [3.0, 5.0, 10.0]
  fg_weight: 5.0

data:
  dataset_type: egodex
  data_root: /home/xuan/embodied-ai/data/egodex/test_240p
  img_h: 240
  img_w: 320
  downsample_factors: [1, 2]
  val_ratio: 0.1
  seed: 42
  load_actions: true
  load_verbs: true
  # Task-grouped PK batches: same-task samples share a primitive (positives);
  # cross-task samples usually differ (negatives). Same sampler as Ours-R2 so
  # batch composition is controlled across the comparison.
  pk_sampler: true
  pk_label: task
  classes_per_batch: 2
  samples_per_class: 4
  pk_reversible_only: false

training:
  per_gpu_batch_size: 4          # ignored when pk_sampler=true (batch = P*K = 8)
  gradient_accumulation_steps: 4
  num_workers: 10
  pin_memory: true
  total_steps: 5000
  lr: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 200
  mixed_precision: bf16
  output_dir: /home/xuan/embodied-ai/checkpoints/lam-dis/ft_l40_cdlam_repro_5k
  save_every: 1000
  eval_every: 500
  log_every: 50
  keep_last_n: 1

logging:
  project: dreamdojo-lam-disentangle
  run_name: ft-l40-cdlam-repro-5k
  use_wandb: false
