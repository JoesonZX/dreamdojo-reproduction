# IDM oracle (stage0 T3b): KL trunk with the reconstruction MSE REMOVED
# (lambda_recon: 0.0) — the latent owes nothing to reconstruction, only to the
# 18-D action head + KL. Expected: highest probe R2, worst ctrl/swap/zeroact —
# the "decodable != controllable" 2x2 argument (analysis section, not headline).
# Copy of ft_l40_full_5k.yaml except lambda_recon / output paths / run_name.
model:
  image_channels: 3
  lam_model_dim: 1024
  lam_latent_dim: 40
  lam_patch_size: 16
  lam_enc_blocks: 24        # 官方 LAM_400k = 24
  lam_dec_blocks: 24
  lam_num_heads: 16
  lam_dropout: 0.0
  beta: 3.0e-3
  beta_env: 1.0e-6
  env_dim: 8
  action_dim: 18
  action_head: true
  lambda_action: 1.0
  lambda_indep: 0.0
  lambda_recon: 0.0         # IDM regime: drop the reconstruction pressure entirely
  init_from: /home/xuan/embodied-ai/checkpoints/pretrained/LAM_400k.ckpt
  freeze_encoder: false
  log_path: /home/xuan/embodied-ai/checkpoints/lam-dis/ft_l40_idm_5k/log_imgs

data:
  dataset_type: egodex
  data_root: /home/xuan/embodied-ai/data/egodex/test_240p
  img_h: 240   # LAM=patchify+RoPE, resolution-agnostic -> 240x320 直接用
  img_w: 320
  downsample_factors: [1, 2]
  val_ratio: 0.1
  seed: 42
  load_actions: true

training:
  per_gpu_batch_size: 16
  gradient_accumulation_steps: 1
  num_workers: 10
  pin_memory: true
  total_steps: 5000
  lr: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 200
  mixed_precision: bf16
  output_dir: /home/xuan/embodied-ai/checkpoints/lam-dis/ft_l40_idm_5k
  save_every: 1000
  eval_every: 500
  log_every: 50
  keep_last_n: 1

logging:
  project: dreamdojo-lam-disentangle
  run_name: ft-l40-idm-5k
  use_wandb: false
