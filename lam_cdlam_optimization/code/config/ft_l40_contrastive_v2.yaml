# Contrastive v2: PK class-balanced sampler (real SupCon positives) + stability fixes.
#  - data.pk_sampler: each batch = P task-classes x K samples -> guaranteed positives
#  - model.beta 1e-4: gentle KL to bound ||z_mu|| (v1 drifted: train KL hit ~143)
#  - model.contrastive_warmup: ramp supcon+temporal so the action head settles first
# Full fine-tune from official LAM_400k, latent=40 (32 action + 8 env), 1000 steps.
model:
  image_channels: 3
  lam_model_dim: 1024
  lam_latent_dim: 40
  lam_patch_size: 16
  lam_enc_blocks: 24
  lam_dec_blocks: 24
  lam_num_heads: 16
  lam_dropout: 0.0
  beta: 1.0e-4              # bound latent norm (was 1e-6 -> drift)
  env_dim: 8
  action_dim: 18
  action_head: true
  lambda_action: 1.0
  lambda_indep: 0.0
  contrastive: true
  proj_dim: 64
  lambda_supcon: 0.3
  lambda_temporal: 0.3
  supcon_tau: 0.1
  contrastive_warmup: 200  # ramp contrastive weights 0->target over 200 steps
  init_from: /home/xuan/embodied-ai/checkpoints/pretrained/LAM_400k.ckpt
  freeze_encoder: false
  log_path: /home/xuan/embodied-ai/checkpoints/lam-dis/ft_l40_contrastive_v2/log_imgs

data:
  dataset_type: egodex
  data_root: /home/xuan/embodied-ai/data/egodex/test_240p
  img_h: 240
  img_w: 320
  downsample_factors: [1, 2]
  val_ratio: 0.1
  seed: 42
  load_actions: true
  pk_sampler: true         # class-balanced batches
  classes_per_batch: 2     # P (micro-batch = P*K = 8)
  samples_per_class: 4     # K -> 3 positives + 4 negatives per anchor

training:
  per_gpu_batch_size: 8    # ignored under pk_sampler (batch = P*K); kept for clarity
  gradient_accumulation_steps: 2   # eff batch 16
  num_workers: 10
  pin_memory: true
  total_steps: 1000
  lr: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 100
  mixed_precision: bf16
  output_dir: /home/xuan/embodied-ai/checkpoints/lam-dis/ft_l40_contrastive_v2
  save_every: 200
  eval_every: 200
  log_every: 50
  keep_last_n: 3

logging:
  project: dreamdojo-lam-disentangle
  run_name: ft-l40-contrastive-v2
  use_wandb: false
