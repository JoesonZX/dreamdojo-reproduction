# SEED-VARIANCE run (training.seed=2) of ft_l40_full_5k: same split, different init/order.
# Fine-tune latent=40 (32a+8e) + KL bottleneck beta_a=3e-3, FULL fine-tune, 5000 steps.
# Exp1-style: action loss supervises all 32 dims; no env split, no bottleneck.
# Source ckpt: NVIDIA DreamDojo LAM_400k (1024/24/24, latent32, patch16, beta1e-6).
#   Set init_from to the downloaded checkpoint, or pass --init_from on CLI.
model:
  image_channels: 3
  lam_model_dim: 1024
  lam_latent_dim: 40
  lam_patch_size: 16
  lam_enc_blocks: 24        # 官方 LAM_400k = 24
  lam_dec_blocks: 24
  lam_num_heads: 16
  lam_dropout: 0.0
  beta: 3.0e-3
  beta_env: 1.0e-6
  env_dim: 8
  action_dim: 18
  action_head: true
  lambda_action: 1.0
  lambda_indep: 0.0
  init_from: /home/xuan/embodied-ai/checkpoints/pretrained/LAM_400k.ckpt
  freeze_encoder: false
  log_path: /home/xuan/embodied-ai/checkpoints/lam-dis/ft_l40_full_5k_s2/log_imgs

data:
  dataset_type: egodex
  data_root: /home/xuan/embodied-ai/data/egodex/test_240p
  img_h: 240   # LAM=patchify+RoPE, resolution-agnostic -> 240x320 直接用
  img_w: 320
  downsample_factors: [1, 2]
  val_ratio: 0.1
  seed: 42
  load_actions: true

training:
  seed: 2          # seed-variance run; data.seed (split) stays 42
  per_gpu_batch_size: 16
  gradient_accumulation_steps: 1
  num_workers: 10
  pin_memory: true
  total_steps: 5000         # fine-tune: hundreds to <=1000 steps
  lr: 1.0e-5                # small lr to avoid catastrophic forgetting
  weight_decay: 0.01
  warmup_steps: 200
  mixed_precision: bf16
  output_dir: /home/xuan/embodied-ai/checkpoints/lam-dis/ft_l40_full_5k_s2
  save_every: 1000
  eval_every: 500
  log_every: 50
  keep_last_n: 1

logging:
  project: dreamdojo-lam-disentangle
  run_name: ft-l40-full-5k-s2
  use_wandb: false
