# Per-task SAM3 object prompts for EgoDex.
#
# SAM3 text grounding needs a CONCRETE category noun on this 240p footage --
# relational phrases ("objects being manipulated") and the bare word "object"
# ground nothing, while "cup" hits 100% (verified A/B, 2026-07-20). So each task
# gets the noun for its manipulated object, mostly read straight from the task
# name. The noun grounds EVERY instance of that class in frame; the contact
# channel (dilated hand & object) is what isolates the one actually in hand.
#
# `default` is used for any task not listed. Entries marked  # CHECK  are best
# guesses for task names that do not name their object -- the 1-video validation
# run flags whichever fail (high o_empty) so only those need a look.

