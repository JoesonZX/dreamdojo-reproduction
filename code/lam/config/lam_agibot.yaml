# LAM training config for AgiBot-World Alpha on 4x RTX 6000 Ada
# Based on DreamDojo paper hyperparameters (Sec 4.1 / Appendix)
# Adapted to 3-GPU setup (GPU 0 occupied by nextgdt; use CUDA_VISIBLE_DEVICES=1,2,3)

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  # AdaWorld LatentActionModel parameters (passed to LAM Lightning wrapper)
  image_channels: 3
  lam_model_dim: 1024          # DreamDojo 700M scale
  lam_latent_dim: 32           # DreamDojo: 32-dim continuous latent action
  lam_patch_size: 16
  lam_enc_blocks: 24           # DreamDojo 700M scale
  lam_dec_blocks: 24           # DreamDojo 700M scale
  lam_num_heads: 16            # DreamDojo 700M scale
  lam_dropout: 0.0
  beta: 1.0e-6                 # DreamDojo value (AdaWorld default=0.01, too large)
  log_interval: 500
  log_path: /home/xuan/embodied-ai/checkpoints/lam/log_imgs

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  # Point to the extracted episodes root (after tar extraction).
  # Layout: {data_root}/{task_id}/{ep_id}/videos/{camera}.mp4
  data_root: /home/xuan/embodied-ai/data/agibotworld/extracted
  camera: head_color           # Front-facing RGB camera (640x480, 30fps)
  img_h: 240
  img_w: 320
  downsample_factors: [1, 2, 3, 4]
  val_ratio: 0.05
  seed: 42

# ── Training ──────────────────────────────────────────────────────────────────
training:
  # Effective batch = per_gpu_batch_size * num_gpus * gradient_accumulation_steps
  # = 32 * 3 * 3 ≈ 288  (close to paper's 256)
  per_gpu_batch_size: 16       # 减半，700M 模型显存占用更大
  gradient_accumulation_steps: 6  # 维持 effective batch ~288
  num_workers: 8
  pin_memory: true

  total_steps: 20000           # fine-tune: 10k baseline + 10k more with fg loss
  lr: 1.0e-5                   # lower lr for fine-tuning
  weight_decay: 0.01
  optimizer: adamw
  lr_scheduler: cosine
  warmup_steps: 200            # short warmup for fine-tune

  mixed_precision: bf16

  # Checkpointing
  output_dir: /home/xuan/embodied-ai/checkpoints/lam-700m-fg
  save_every: 2000
  eval_every: 1000
  log_every: 100
  keep_last_n: 3

# ── Foreground loss ────────────────────────────────────────────────────────────
foreground:
  use_fg_loss: true
  fg_weight: 5.0               # foreground pixels get 5x reconstruction loss weight

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  project: dreamdojo-lam
  run_name: lam-agibot-700m-fg-10k
  use_wandb: false
