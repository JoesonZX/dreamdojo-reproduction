# Fine-tune latent=40 (32 action + 8 env), FULL fine-tune, ConLA-style CONTRASTIVE
# disentanglement instead of the KL bottleneck (advisor: KL constrains distributions,
# it does not route action vs scene content). Separator = supervised-contrastive on
# z_a (task-label prior) + temporal-reverse cue (z_a flips, z_e stable). KL is a plain
# tiny VAE regularizer (beta=1e-6, single, no beta_env -> no split-KL bottleneck).
# Source ckpt: NVIDIA DreamDojo LAM_400k (1024/24/24, latent32, patch16, beta1e-6).
model:
  image_channels: 3
  lam_model_dim: 1024
  lam_latent_dim: 40
  lam_patch_size: 16
  lam_enc_blocks: 24
  lam_dec_blocks: 24
  lam_num_heads: 16
  lam_dropout: 0.0
  beta: 1.0e-6              # plain VAE KL on ALL dims (no asymmetric bottleneck)
  env_dim: 8
  action_dim: 18
  action_head: true
  lambda_action: 1.0
  lambda_indep: 0.0
  # ── ConLA contrastive disentanglement ──
  contrastive: true
  proj_dim: 64
  lambda_supcon: 0.3       # supervised contrastive on z_a (same-task = positive)
  lambda_temporal: 0.3     # temporal-reverse: z_e invariant + z_a sensitive
  supcon_tau: 0.1
  init_from: /home/xuan/embodied-ai/checkpoints/pretrained/LAM_400k.ckpt
  freeze_encoder: false
  log_path: /home/xuan/embodied-ai/checkpoints/lam-dis/ft_l40_contrastive/log_imgs

data:
  dataset_type: egodex
  data_root: /home/xuan/embodied-ai/data/egodex/test_240p
  img_h: 240
  img_w: 320
  downsample_factors: [1, 2]
  val_ratio: 0.1
  seed: 42
  load_actions: true

training:
  per_gpu_batch_size: 8       # micro-batch 8 so two fwd passes (main + reverse encode) fit
  gradient_accumulation_steps: 2   # eff batch 16 == ft_l40_full
  num_workers: 10
  pin_memory: true
  total_steps: 1000
  lr: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 100
  mixed_precision: bf16
  output_dir: /home/xuan/embodied-ai/checkpoints/lam-dis/ft_l40_contrastive
  save_every: 200
  eval_every: 200
  log_every: 50
  keep_last_n: 3

logging:
  project: dreamdojo-lam-disentangle
  run_name: ft-l40-contrastive
  use_wandb: false
