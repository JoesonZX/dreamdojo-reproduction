# Ours-C: Ours-B + phase-aware semantic hard-negative sigmoid contrast.
# Semantics decide positive/negative pairs; local action magnitude and phase only
# provide a soft core-action weight, so composite videos are not hard-cropped.
model:
  image_channels: 3
  lam_model_dim: 1024
  lam_latent_dim: 40
  lam_patch_size: 16
  lam_enc_blocks: 24
  lam_dec_blocks: 24
  lam_num_heads: 16
  lam_dropout: 0.0
  beta: 3.0e-3
  beta_env: 1.0e-6
  env_dim: 8
  action_dim: 18
  action_head: true
  lambda_action: 1.0
  lambda_indep: 0.0
  lambda_zero: 0.1
  zero_margin: 0.05
  lambda_reverse: 0.1
  reverse_warmup: 500
  reverse_action_target_cos: -0.2
  reverse_env_target_cos: 0.8
  lambda_hardneg: 0.05
  hardneg_tau: 0.1
  hardneg_core_rotation_scale: 0.5
  hardneg_core_motion_floor: 0.2
  hardneg_core_temporal_floor: 0.6
  hardneg_core_motion_temp: 1.0
  hardneg_same_task_negative: true
  init_from: /home/xuan/embodied-ai/checkpoints/pretrained/LAM_400k.ckpt
  freeze_encoder: false
  log_path: /home/xuan/embodied-ai/checkpoints/lam-dis/ft_l40_ours_c_zero_reverse_hardneg_5k/log_imgs

data:
  dataset_type: egodex
  data_root: /home/xuan/embodied-ai/data/egodex/test_240p
  img_h: 240
  img_w: 320
  downsample_factors: [1, 2]
  val_ratio: 0.1
  seed: 42
  load_actions: true
  load_verbs: true
  pk_sampler: true
  pk_label: task
  classes_per_batch: 2
  samples_per_class: 2

training:
  per_gpu_batch_size: 4
  gradient_accumulation_steps: 8
  num_workers: 10
  pin_memory: true
  total_steps: 5000
  lr: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 200
  mixed_precision: bf16
  output_dir: /home/xuan/embodied-ai/checkpoints/lam-dis/ft_l40_ours_c_zero_reverse_hardneg_5k
  save_every: 1000
  eval_every: 500
  log_every: 50
  keep_last_n: 1

logging:
  project: dreamdojo-lam-disentangle
  run_name: ft-l40-ours-c-zero-reverse-hardneg-5k
  use_wandb: false
