# Exp1 — add action-prediction loss. latent_dim=32, ALL 32 dims supervised.
model:
  image_channels: 3
  lam_model_dim: 512
  lam_latent_dim: 32
  lam_patch_size: 16
  lam_enc_blocks: 8
  lam_dec_blocks: 8
  lam_num_heads: 8
  lam_dropout: 0.0
  beta: 1.0e-6
  # ── disentanglement flags ──
  env_dim: 0
  action_dim: 18
  action_head: true
  lambda_action: 1.0
  lambda_indep: 0.0
  log_path: /home/xuan/embodied-ai/checkpoints/lam-dis/exp1_action/log_imgs

data:
  dataset_type: egodex
  data_root: /home/xuan/embodied-ai/data/egodex/test_240p
  img_h: 240
  img_w: 320
  downsample_factors: [1, 2]
  val_ratio: 0.1
  seed: 42
  load_actions: true

training:
  per_gpu_batch_size: 32
  gradient_accumulation_steps: 1
  num_workers: 10
  pin_memory: true
  total_steps: 10000
  lr: 2.5e-5
  weight_decay: 0.01
  warmup_steps: 1000
  mixed_precision: bf16
  output_dir: /home/xuan/embodied-ai/checkpoints/lam-dis/exp1_action
  save_every: 2000
  eval_every: 1000
  log_every: 100
  keep_last_n: 3

logging:
  project: dreamdojo-lam-disentangle
  run_name: dis-exp1-action-20k
  use_wandb: false
